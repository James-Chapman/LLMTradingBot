<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Log in — LLM Trading Bot</title>
    <!-- styles.css is the only asset served without a session -->
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<!-- Shown when the bot listens on a network address (-host is not loopback). -->
<main class="login-main">
    <form id="login-form" class="login-card" autocomplete="off">
        <h1 class="dialog-title">LLM Trading Bot</h1>
        <p class="setting-help login-intro">
            Enter the access token printed in the bot's console at start-up.
        </p>
        <label class="setting-label" for="token">Access token</label>
        <input id="token" name="token" type="password" class="input mono" required autofocus>
        <p id="error" class="form-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary">Log in</button>
    </form>
</main>

<script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error');

    // Show a message under the token field (textContent: never parsed as HTML).
    function showError(message) {
        errorBox.textContent = message;
        errorBox.hidden = false;
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.hidden = true;
        const token = document.getElementById('token').value.trim();
        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token }),
            });
            if (response.ok) {
                // The server set the session cookie; open the dashboard.
                window.location.replace('/');
                return;
            }
            const body = await response.json().catch(() => ({}));
            showError(body.detail || `Login failed (${response.status})`);
        } catch (err) {
            showError('Cannot reach the bot: ' + err.message);
        }
    });
</script>
</body>
</html>
