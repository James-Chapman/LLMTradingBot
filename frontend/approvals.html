<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Approvals — LLM Trading Bot</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────── -->
<header class="page-header">
    <div class="row">
        <a href="/#/overview/approvals" class="btn btn-ghost btn-small">← Dashboard</a>
        <h1 class="dialog-title">Trade Approvals</h1>
    </div>
    <span id="count-badge" class="pill pill-outline">Loading…</span>
</header>

<!-- ── Main ───────────────────────────────────────────────────────────── -->
<main class="page-main">
    <div id="container">
        <div class="panel"><p class="empty">Loading…</p></div>
    </div>
</main>

<script>
// Sends the browser to the login form when the bot answers 401 (it listens beyond
// this computer and the session is missing or the access token was changed).
const plainFetch = window.fetch.bind(window);
window.fetch = async (...args) => {
    const response = await plainFetch(...args);
    if (response.status === 401) window.location.assign('/login');
    return response;
};

// Escapes a server or LLM string for safe use inside innerHTML (text and quoted attributes).
function esc(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// Parses an API timestamp. Storage timestamps are naive UTC ("2026-11-14T10:00:00"),
// so a 'Z' is appended when the string carries no zone or offset.
function parseUtc(value) {
    const text = String(value ?? '');
    const hasZone = /(Z|[+-]\d{2}:?\d{2})$/i.test(text);
    return new Date(hasZone ? text : text + 'Z');
}

// Shows the count in the header badge: amber only while trades wait, red for an error.
function setBadge(text, pill) {
    const badge = document.getElementById('count-badge');
    badge.textContent = text;
    badge.className = `pill ${pill}`;
}

// Replaces the list with an error so a failed load never leaves "Loading…" on screen.
function showLoadError(message) {
    setBadge('Error', 'pill-loss');
    document.getElementById('container').innerHTML = `
        <div class="panel"><div class="empty is-error">
            <strong>Could not load approvals</strong><br>
            ${esc(message)} — retrying every few seconds.
        </div></div>`;
}

// Renders one approval as a card; every server value goes through esc().
function approvalCard(a) {
    const long = a.direction === 'long';
    const pct = Math.round(a.confidence * 100);
    const expiry = parseUtc(a.expires_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return `
    <article class="approval-page-card" data-card-id="${esc(a.id)}">
        <div class="row-between">
            <div class="row">
                <span class="market-quote-price">${esc(a.market)}</span>
                <span class="pill ${long ? 'pill-profit' : 'pill-loss'}">${long ? '▲' : '▼'} ${esc(a.direction.toUpperCase())}</span>
            </div>
            <div class="list-item-meta">
                <div>${esc(a.strategy_id)}</div>
                <div>Expires ${esc(expiry)}</div>
            </div>
        </div>

        <div class="row approval-confidence">
            <span class="meter"><span class="meter-fill ${long ? 'is-long' : 'is-short'}" style="width:${pct}%"></span></span>
            <span class="num ${long ? 'pos' : 'neg'}">${pct}%</span>
            <span class="muted">confidence</span>
        </div>

        <div class="approval-details">
            <div><h2 class="section-title">Thesis</h2><p>${esc(a.thesis)}</p></div>
            <div><h2 class="section-title">Entry</h2><p>${esc(a.entry_plan)}</p></div>
            <div><h2 class="section-title">Exit</h2><p>${esc(a.exit_plan)}</p></div>
        </div>

        <div class="approval-foot">
            <span class="${a.risk_approved ? 'pos' : 'neg'}">Risk: ${esc(a.risk_reason)}</span>
            <div class="approval-actions">
                <button type="button" class="btn btn-primary" data-approval-id="${esc(a.id)}" data-approval-action="approve">✓ Approve</button>
                <button type="button" class="btn btn-danger-quiet" data-approval-id="${esc(a.id)}" data-approval-action="reject">✗ Reject</button>
            </div>
        </div>
    </article>`;
}

// Fetches the pending approvals and renders one card per trade.
async function load() {
    try {
        const r = await fetch('/api/approvals');
        if (!r.ok) {
            const body = await r.json().catch(() => ({}));
            showLoadError(body.detail || `HTTP ${r.status}`);
            return;
        }
        const approvals = await r.json();

        if (approvals.length) {
            setBadge(`${approvals.length} pending`, 'pill-warning');
        } else {
            setBadge('None pending', 'pill-outline');
        }

        const el = document.getElementById('container');
        if (!approvals.length) {
            el.innerHTML = `
                <div class="panel"><div class="empty">
                    <strong>No pending approvals</strong><br>
                    Choose the <b>semi-automated</b> mode in the dashboard's Trading settings dialog to generate trade proposals.
                </div></div>`;
            return;
        }
        el.innerHTML = approvals.map(approvalCard).join('');
    } catch (e) {
        console.error(e);
        showLoadError(`The server could not be reached (${e.message})`);
    }
}

// Approves or rejects one trade and tells the operator when no real order was executed.
async function decide(id, action) {
    const card = [...document.querySelectorAll('[data-card-id]')].find(c => c.dataset.cardId === id);
    const restoreCard = () => card?.classList.remove('is-busy');
    card?.classList.add('is-busy');
    try {
        const r = await fetch(`/api/approvals/${encodeURIComponent(id)}/${action}`, { method: 'POST' });
        const d = await r.json().catch(() => ({}));
        if (action === 'approve' && r.status === 503) {
            // No live price (or the emergency stop): nothing was sent and the approval stays queued.
            restoreCard();
            alert(`Trade NOT executed - the approval is still pending: ${d.detail || 'try again shortly'}`);
        } else if (action === 'approve' && r.status === 409) {
            // The risk checks refused it at approval time (the detail says whether it was removed).
            restoreCard();
            alert(`Trade NOT executed: ${d.detail || 'refused by the risk check'}`);
        } else if (!r.ok) {
            restoreCard();
            alert(`Could not ${action} the trade: ${d.detail || `HTTP ${r.status}`}`);
        } else if (action === 'approve' && d.order_status === 'rejected') {
            alert(`Trade approved but the ${d.environment || 'paper'} order was REJECTED (e.g. insufficient funds).`);
        }
        setTimeout(load, 400);
    } catch (e) {
        console.error(e);
        restoreCard();
        alert(`Could not ${action} the trade — the server could not be reached (${e.message}).`);
    }
}

// Approve / Reject buttons carry the approval ID in data attributes, never in inline script,
// so a server value can't break out of an onclick handler.
document.addEventListener('click', e => {
    const button = e.target.closest('[data-approval-action]');
    if (button) decide(button.dataset.approvalId, button.dataset.approvalAction);
});

load();
setInterval(load, 3000);
</script>
</body>
</html>
