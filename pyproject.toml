[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--ignore=tests/test_integration.py"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["backend", "tests"]
exclude = [
    ".venv",
    "__pycache__",
    "*.db",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.ruff.lint.per-file-ignores]
"cli.py" = ["E402"]
"tests/*.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
